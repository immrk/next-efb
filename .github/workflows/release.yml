name: Version and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-master
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create or update version pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version:packages
          commit: "chore: release new version"
          title: "chore: release new version"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release target
        id: release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build Windows installer
        run: npm run make
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Generate release notes
        run: npm run release:notes

      - name: Verify update artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path out -Filter "NextEFB-*-Setup.exe" -File
          $metadata = Get-Item -Path "out/latest.yml"
          if (-not $installer -or -not $metadata) {
            throw "The installer or latest.yml update metadata is missing."
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextEFB-${{ needs.version.outputs.version }}-windows
          path: |
            out/NextEFB-*-Setup.exe
            out/NextEFB-*-Setup.exe.blockmap
            out/latest.yml
          if-no-files-found: error

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $assets = @(
            Get-ChildItem -Path out -Filter "NextEFB-*-Setup.exe" -File
            Get-ChildItem -Path out -Filter "NextEFB-*-Setup.exe.blockmap" -File
            Get-Item -Path "out/latest.yml"
          ) | ForEach-Object { $_.FullName }

          gh release create $env:RELEASE_TAG @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "NextEFB v$env:RELEASE_VERSION" `
            --notes-file "release-notes.md"
